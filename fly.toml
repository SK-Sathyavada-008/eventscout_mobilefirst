app = "eventscout-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  MONGODB_DATABASE = "eventscout"
  JWT_ALGORITHM = "HS256"
  JWT_EXPIRE_DAYS = "7"
  DEV_USER_USERNAME = "sk"
  DEV_USER_PASSWORD = "krishna"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
